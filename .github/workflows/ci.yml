name: Windows tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      DEEPSEEK_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # checkout v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # setup-python v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            Tools/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -e ./Tools
      - name: Check public source candidates
        run: python packaging/audit_public.py
      - name: Run offline tests
        run: python -m pytest -q
      - name: Check chick assets and interaction
        run: python app.py --chick-self-test
      - name: Check unified workspace
        run: python app.py --unified-self-test
